<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контроль Гостиницы v4 - Dashboard</title>
    <style>
        :root { --bg: #f0f4f8; --card: #fff; --primary: #3498db; --success: #2ecc71; --warning: #f1c40f; --danger: #e74c3c; --process: #bdc3c7; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #2c3e50; }
        
        .dashboard { background: #2c3e50; color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; flex-wrap: wrap; text-align: center; }
        .dash-item { margin: 10px; }
        .dash-val { font-size: 24px; font-weight: bold; color: var(--success); }

        .header { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; position: sticky; top: 10px; z-index: 100; }
        
        .floor-nav { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
        .floor-btn-group { display: flex; align-items: center; background: #eee; border-radius: 8px; overflow: hidden; }
        .floor-btn { padding: 10px 12px; border: none; background: transparent; cursor: pointer; font-weight: bold; }
        .floor-btn.active { background: var(--primary); color: white; }
        .toggle-floor { padding: 10px; cursor: pointer; border: none; background: #ddd; font-size: 14px; }
        .toggle-floor.off { background: #666; color: white; }

        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .filter-btn { padding: 8px 15px; border-radius: 20px; border: 2px solid var(--primary); cursor: pointer; font-weight: bold; background: white; }
        .filter-btn.active { background: var(--primary); color: white; }

        .summary-panel { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 10px; }
        .stat-item { padding: 5px 12px; border-radius: 15px; font-size: 11px; font-weight: bold; color: white; background: var(--danger); }
        .stat-item.complete { background: var(--success); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; border-top: 4px solid var(--primary); display: block; }
        .card.hidden { display: none; }
        
        .room-num { font-size: 1.2em; font-weight: bold; margin-bottom: 10px; color: var(--primary); }
        .items { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .btn { padding: 6px 8px; border-radius: 4px; border: 1px solid #ddd; font-size: 10px; cursor: pointer; font-weight: 700; background: #ecf0f1; }
        .btn.status-1 { background: var(--success); color: white; border-color: var(--success); }
        .btn.status-2 { background: var(--warning); color: #000; border-color: var(--warning); }
        
        .input-sub { width: 100%; margin-top: 5px; border: 1px solid #eee; border-radius: 4px; padding: 4px; font-size: 11px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="dashboard" id="mainDash">
    <div class="dash-item">ОБЩИЙ ПРОГРЕСС: <div id="totalProgress" class="dash-val">0%</div></div>
    <div class="dash-item">ГОТОВО НОМЕРОВ: <div id="roomsDone" class="dash-val">0 / 0</div></div>
</div>

<div class="header">
    <div class="floor-nav" id="floorNav"></div>
    <div class="controls">
        <button class="filter-btn" id="probFilter" onclick="toggleProblemFilter()">Только проблемы ⚠️</button>
    </div>
    <div class="summary-panel" id="summaryPanel"></div>
</div>

<div class="grid" id="mainGrid"></div>

<script>
const furnitureBase = ["Тумбы", "Стол", "Кухня", "Шкаф", "Санузел", "Прихожая"];
let db = JSON.parse(localStorage.getItem('hotel_v4_db')) || {};
let activeFloor = 1;
let showOnlyProblems = false;
let disabledFloors = JSON.parse(localStorage.getItem('disabled_floors')) || [];

const config = {
    1: { range: [1, 13], singleTv: [6, 13], g: 0 },
    2: { range: [14, 31], singleTv: [14, 15, 16, 25, 31], g: 2 },
    3: { range: [32, 47], singleTv: [32, 33, 34, 42, 47], g: 2 },
    4: { range: [48, 63], singleTv: [48, 49, 50, 58, 63], g: 2 },
    5: { range: [64, 79], singleTv: [64, 65, 66, 74, 79], g: 2 },
    6: { range: [80, 95], singleTv: [80, 81, 82, 90, 95], g: 2 },
    7: { range: [96, 111], singleTv: [96, 97, 98, 106, 111], extra: ["106/1"], g: 2 },
    8: { range: [112, 127], singleTv: [112, 113, 114, 127], g: 1 },
    9: { range: [128, 143], singleTv: [128, 129, 130, 143], g: 1 }
};

function updateDashboard() {
    let totalItems = 0;
    let readyItems = 0;
    let totalRooms = 0;
    let readyRooms = 0;

    for (let f in config) {
        if (disabledFloors.includes(parseInt(f))) continue;
        
        let c = config[f];
        let rooms = [];
        for(let i = c.range[0]; i <= c.range[1]; i++) rooms.push(i.toString());
        if(c.extra) rooms.push(...c.extra);
        if(c.g >= 1) rooms.push("Горничная 1");
        if(c.g >= 2) rooms.push("Горничная 2");

        rooms.forEach(r => {
            totalRooms++;
            let roomReady = true;
            let items = furnitureBase.slice();
            const isSingleTv = c.singleTv?.includes(parseInt(r)) || r.includes("Горничная") || r === "106/1";
            if(isSingleTv) items.push('ТВ-2000'); else items.push('ТВ-1800', 'ТВ-2300');

            items.forEach(it => {
                totalItems++;
                if(db[r]?.[it] === 1) readyItems++; else roomReady = false;
            });
            if(roomReady) readyRooms++;
        });
    }

    document.getElementById('totalProgress').innerText = Math.round((readyItems/totalItems)*100 || 0) + '%';
    document.getElementById('roomsDone').innerText = readyRooms + ' / ' + totalRooms;
}

function renderFloor(f) {
    activeFloor = f;
    updateDashboard();
    const grid = document.getElementById('mainGrid');
    const summaryPanel = document.getElementById('summaryPanel');
    grid.innerHTML = '';
    
    const c = config[f];
    let rooms = [];
    for(let i = c.range[0]; i <= c.range[1]; i++) rooms.push(i.toString());
    if(c.extra) rooms.splice(rooms.indexOf("106")+1, 0, ...c.extra);
    if(c.g >= 1) rooms.push("Горничная 1");
    if(c.g >= 2) rooms.push("Горничная 2");

    let stats = { "ТВ": {ready: 0, total: 0} };
    furnitureBase.forEach(item => stats[item] = {ready: 0, total: 0});

    rooms.forEach(r => {
        const isSingleTv = c.singleTv?.includes(parseInt(r)) || r.includes("Горничная") || r === "106/1";
        const state = db[r] || {};
        
        let roomIsComplete = true;
        let tvItems = isSingleTv ? ['ТВ-2000'] : ['ТВ-1800', 'ТВ-2300'];
        tvItems.forEach(tv => { stats["ТВ"].total++; if(state[tv]===1) stats["ТВ"].ready++; else roomIsComplete = false; });
        furnitureBase.forEach(it => { stats[it].total++; if(state[it]===1) stats[it].ready++; else roomIsComplete = false; });

        if (showOnlyProblems && roomIsComplete) return;

        const card = document.createElement('div');
        card.className = 'card';
        
        let tvHtml = tvItems.map(tv => `<button class="btn status-${state[tv]||0}" onclick="toggle('${r}','${tv}')">${tv}</button>`).join('');
        let otherHtml = furnitureBase.map(it => `<button class="btn status-${state[it]||0}" onclick="toggle('${r}','${it}')">${it}</button>`).join('');

        card.innerHTML = `<div class="room-num">№ ${r}</div><div class="items">${tvHtml}${otherHtml}</div>
            <input type="text" class="input-sub" placeholder="Ссылка на фото..." onchange="saveData('${r}','photo',this.value)" value="${state.photo||''}">
            <textarea class="input-sub" placeholder="Заметки..." onchange="saveData('${r}','note',this.value)">${state.note || ''}</textarea>`;
        grid.appendChild(card);
    });

    summaryPanel.innerHTML = Object.keys(stats).map(k => `<div class="stat-item ${stats[k].ready===stats[k].total?'complete':''}">${k}: ${stats[k].ready}/${stats[k].total}</div>`).join('');
}

window.toggle = (r, it) => { db[r] = db[r] || {}; db[r][it] = ((db[r][it] || 0) + 1) % 3; save(); };
window.saveData = (r, key, val) => { db[r] = db[r] || {}; db[r][key] = val; save(); };
function save() { localStorage.setItem('hotel_v4_db', JSON.stringify(db)); renderFloor(activeFloor); }

function toggleProblemFilter() { 
    showOnlyProblems = !showOnlyProblems; 
    document.getElementById('probFilter').classList.toggle('active');
    renderFloor(activeFloor); 
}

const nav = document.getElementById('floorNav');
for(let i=1; i<=9; i++) {
    const group = document.createElement('div'); group.className = 'floor-btn-group';
    const b = document.createElement('button'); b.className = 'floor-btn' + (i==1?' active':''); b.innerText = i + ' эт';
    b.onclick = () => { document.querySelectorAll('.floor-btn').forEach(btn => btn.classList.remove('active')); b.classList.add('active'); renderFloor(i); };
    
    const eye = document.createElement('button'); eye.className = 'toggle-floor' + (disabledFloors.includes(i)?' off':''); eye.innerText = '👁';
    eye.onclick = () => {
        if(disabledFloors.includes(i)) disabledFloors = disabledFloors.filter(x => x!==i);
        else disabledFloors.push(i);
        localStorage.setItem('disabled_floors', JSON.stringify(disabledFloors));
        eye.classList.toggle('off'); updateDashboard(); renderFloor(activeFloor);
    };
    group.append(b, eye); nav.appendChild(group);
}
renderFloor(1);
</script>
</body>
</html>
