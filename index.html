<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HOTEL ONLINE CONTROL v5.4 PRO</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        :root { 
            --bg: #f0f4f8; 
            --card: #fff; 
            --primary: #3498db; 
            --success: #2ecc71; /* Зеленый - 1 выезд */
            --trip2: #4fc3f7;   /* Голубой - 2 выезд */
            --trip3: #f1c40f;   /* Желтый - 3 выезд */
            --danger: #e74c3c;  /* Красный - Замечания */
            --dark: #2c3e50; 
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #2c3e50; }
        
        .sync-status { position: fixed; top: 10px; right: 10px; padding: 5px 10px; border-radius: 5px; font-size: 12px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 1000; font-weight: bold; }
        .lock-btn { position: fixed; top: 10px; left: 10px; padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; z-index: 1000; background: #e74c3c; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .lock-btn.unlocked { background: #2ecc71; }
        
        /* Легенда цветов */
        .legend { background: white; padding: 10px; border-radius: 12px; margin-top: 45px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; font-size: 12px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 3px; }

        .dashboard { background: var(--dark); color: white; padding: 15px; border-radius: 15px; margin: 10px 0 15px 0; display: flex; justify-content: space-around; text-align: center; flex-wrap: wrap; }
        .dash-val { font-size: 20px; font-weight: bold; color: var(--success); }
        
        .header { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; position: sticky; top: 5px; z-index: 100; }
        .floor-nav { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        .floor-btn-group { display: flex; align-items: center; background: #eee; border-radius: 8px; border: 1px solid #ddd; }
        .floor-btn { padding: 8px 12px; border: none; background: transparent; cursor: pointer; font-weight: bold; font-size: 14px; }
        .floor-btn.active { background: var(--primary); color: white; border-radius: 7px; }
        
        .toggle-floor, .toggle-room { padding: 8px; cursor: pointer; border: none; background: transparent; opacity: 0.7; }
        .toggle-floor { border-left: 1px solid #ccc; }
        .toggle-room { font-size: 14px; float: right; margin-top: -5px; }
        .off { opacity: 0.2 !important; filter: grayscale(1); }
        
        .filter-btn { padding: 8px 20px; border-radius: 20px; border: 2px solid var(--primary); cursor: pointer; font-weight: bold; background: white; }
        .filter-btn.active { background: var(--danger); color: white; border-color: var(--danger); }
        
        .summary-panel { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 10px; }
        .stat-item { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; color: white; background: #95a5a6; }
        .stat-item.active { background: var(--primary); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { background: var(--card); padding: 12px; border-radius: 12px; border-top: 5px solid var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.05); position: relative; }
        .room-num { font-size: 1.2em; font-weight: bold; margin-bottom: 8px; color: var(--primary); border-bottom: 1px solid #eee; padding-bottom: 5px; }
        
        .items { display: flex; flex-wrap: wrap; gap: 4px; }
        .btn { padding: 6px 7px; border-radius: 4px; border: 1px solid #ddd; font-size: 10px; cursor: pointer; font-weight: 700; background: #f8f9fa; transition: 0.2s; }
        
        /* Цвета статусов */
        .btn.status-1 { background: var(--success); color: white; border-color: var(--success); }
        .btn.status-2 { background: var(--trip2); color: white; border-color: var(--trip2); }
        .btn.status-3 { background: var(--trip3); color: #000; border-color: var(--trip3); }
        .btn.status-4 { background: var(--danger); color: white; border-color: var(--danger); }

        .input-sub { width: 100%; margin-top: 8px; border: 1px solid #eee; border-radius: 5px; padding: 6px; font-size: 11px; box-sizing: border-box; }
    </style>
</head>
<body>

<button class="lock-btn" id="lockBtn" onclick="askAccess()">🔒 Доступ закрыт</button>
<div class="sync-status" id="syncStatus">☁️ Соединение...</div>

<div class="legend">
    <div class="legend-item"><div class="dot" style="background:var(--success)"></div> 1-й выезд</div>
    <div class="legend-item"><div class="dot" style="background:var(--trip2)"></div> 2-й выезд</div>
    <div class="legend-item"><div class="dot" style="background:var(--trip3)"></div> 3-й выезд</div>
    <div class="legend-item"><div class="dot" style="background:var(--danger)"></div> Замечания</div>
</div>

<div class="dashboard">
    <div>ГОТОВНОСТЬ ОБЪЕКТА: <div id="totalProgress" class="dash-val">0%</div></div>
    <div>ГОТОВЫЕ НОМЕРА: <div id="roomsDone" class="dash-val">0 / 0</div></div>
</div>

<div class="header">
    <div class="floor-nav" id="floorNav"></div>
    <div style="text-align:center"><button class="filter-btn" id="probFilter" onclick="toggleProblemFilter()">⚠️ Только замечания</button></div>
    <div id="summaryPanel" class="summary-panel"></div>
</div>

<div class="grid" id="mainGrid"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDaozobSoa1EaXK8_3kRP8zw0wJIsIJI0M",
        authDomain: "hotelcontrol-a5bd0.firebaseapp.com",
        projectId: "hotelcontrol-a5bd0",
        storageBucket: "hotelcontrol-a5bd0.firebasestorage.app",
        messagingSenderId: "301848830123",
        appId: "1:301848830123:web:555460ce3110558d64d7ee",
        databaseURL: "https://hotelcontrol-a5bd0-default-rtdb.europe-west1.firebasedatabase.app/"
    };

    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('hotel_v5_data');
    
    let localData = {};
    let activeFloor = 1;
    let isEditMode = false;
    let showOnlyProblems = false;
    let disabledFloors = JSON.parse(localStorage.getItem('disabled_floors')) || [];
    let hiddenRooms = JSON.parse(localStorage.getItem('hidden_rooms')) || [];

    const furnitureBase = ["Тумбы", "Стол", "Кухня", "Шкаф", "Санузел", "Прихожая"];
    const config = {
        1: { range: [1, 13], singleTv: [6, 13], eyeRooms: [10], g: 0 },
        2: { range: [14, 31], singleTv: [14, 15, 16, 25, 31], eyeRooms: [17, 28], g: 2 },
        3: { range: [32, 47], singleTv: [32, 33, 34, 42, 47], g: 2 },
        4: { range: [48, 63], singleTv: [48, 49, 50, 58, 63], g: 2 },
        5: { range: [64, 79], singleTv: [64, 65, 66, 74, 79], g: 2 },
        6: { range: [80, 95], singleTv: [80, 81, 82, 90, 95], g: 2 },
        7: { range: [96, 111], singleTv: [96, 97, 98, 106, 111], extra: ["106/1"], g: "special_7" },
        8: { range: [112, 127], singleTv: [112, 113, 114, 127], eyeRooms: [122], g: 1 },
        9: { range: [128, 143], singleTv: [128, 129, 130, 143], eyeRooms: [138], g: 1 }
    };

    function askAccess() {
        if(isEditMode) { isEditMode = false; updateLockUI(); return; }
        let pass = prompt("Введите код доступа для редактирования:");
        if(pass === "0000") { isEditMode = true; updateLockUI(); } 
        else { alert("Неверный код!"); }
    }

    function updateLockUI() {
        const btn = document.getElementById('lockBtn');
        if(isEditMode) { btn.innerText = "🟢 Правка разрешена"; btn.classList.add('unlocked'); } 
        else { btn.innerText = "🔒 Доступ закрыт"; btn.classList.remove('unlocked'); }
        renderFloor(activeFloor);
    }

    dbRef.on('value', (snapshot) => {
        localData = snapshot.val() || {};
        document.getElementById('syncStatus').innerText = "✅ На связи";
        renderFloor(activeFloor);
        updateDashboard();
    });

    function toggle(r, it) {
        if(!isEditMode) { alert("Включите режим правки!"); return; }
        // Цикл статусов: 0 (серый) -> 1 (зеленый) -> 2 (голубой) -> 3 (желтый) -> 4 (красный) -> 0
        let next = (((localData[r] && localData[r][it]) || 0) + 1) % 5;
        dbRef.child(r).child(it).set(next);
    }

    function saveData(r, key, val) { 
        if(!isEditMode) return;
        dbRef.child(r).child(key).set(val); 
    }

    function toggleRoomVisibility(r) {
        if(!isEditMode) return;
        if(hiddenRooms.includes(r)) hiddenRooms = hiddenRooms.filter(x => x!==r);
        else hiddenRooms.push(r);
        localStorage.setItem('hidden_rooms', JSON.stringify(hiddenRooms));
        renderFloor(activeFloor);
        updateDashboard();
    }

    function getRoomsForFloor(f) {
        const c = config[f];
        let rooms = [];
        for(let i = c.range[0]; i <= c.range[1]; i++) rooms.push(i.toString());
        if(c.extra) rooms.push(...c.extra);
        if(c.g === "special_7") rooms.push("Горничная 2мп");
        else {
            if(c.g >= 1) rooms.push("Горничная 1мп");
            if(c.g >= 2) rooms.push("Горничная 2мп");
        }
        return rooms;
    }

    function renderFloor(f) {
        activeFloor = f;
        const grid = document.getElementById('mainGrid');
        const summaryPanel = document.getElementById('summaryPanel');
        grid.innerHTML = '';
        const c = config[f];
        const rooms = getRoomsForFloor(f);

        let stats = { "ТВ": {ready: 0, total: 0} };
        furnitureBase.forEach(item => stats[item] = {ready: 0, total: 0});

        rooms.forEach(r => {
            const isHidden = hiddenRooms.includes(r);
            const state = localData[r] || {};
            const isSingleTv = c.singleTv?.includes(parseInt(r)) || r.includes("Горничная") || r === "106/1";
            let tvItems = isSingleTv ? ['ТВ-2000'] : ['ТВ-1800', 'ТВ-2300'];
            let items = [...tvItems, ...furnitureBase];
            
            // Фильтр "Только замечания" (красный цвет - статус 4)
            let hasRed = items.some(it => state[it] === 4);
            if(showOnlyProblems && !hasRed) return;
            if(isHidden && !isEditMode) return; 

            if(!isHidden) {
                tvItems.forEach(tv => { stats["ТВ"].total++; if(state[tv] >= 1 && state[tv] <= 3) stats["ТВ"].ready++; });
                furnitureBase.forEach(it => { stats[it].total++; if(state[it] >= 1 && state[it] <= 3) stats[it].ready++; });
            }

            const card = document.createElement('div');
            card.className = 'card' + (isHidden ? ' off' : '');
            card.innerHTML = `
                ${isEditMode ? `<button class="toggle-room" onclick="toggleRoomVisibility('${r}')">${isHidden?'👁‍🗨':'👁'}</button>` : ''}
                <div class="room-num">№ ${r} ${isHidden ? '(Скрыт)' : ''}</div>
                <div class="items">` + 
                (isHidden && !isEditMode ? '' : items.map(it => `<button class="btn status-${state[it]||0}" onclick="toggle('${r}','${it}')">${it}</button>`).join('')) + 
                `</div>
                <input class="input-sub" ${!isEditMode?'disabled':''} placeholder="Ссылка на фото" onchange="saveData('${r}','photo',this.value)" value="${state.photo||''}">
                <textarea class="input-sub" ${!isEditMode?'disabled':''} placeholder="Заметки" onchange="saveData('${r}','note',this.value)">${state.note||''}</textarea>`;
            grid.appendChild(card);
        });
        summaryPanel.innerHTML = Object.keys(stats).map(k => `<div class="stat-item active">${k}: ${stats[k].ready}/${stats[k].total}</div>`).join('');
    }

    function updateDashboard() {
        let totalItems = 0, readyItems = 0, totalRooms = 0, readyRooms = 0;
        for (let f in config) {
            if (disabledFloors.includes(parseInt(f))) continue;
            let rooms = getRoomsForFloor(f);
            rooms.forEach(r => {
                if (hiddenRooms.includes(r)) return;
                totalRooms++;
                let roomReady = true;
                const c = config[f];
                const isSingleTv = c.singleTv?.includes(parseInt(r)) || r.includes("Горничная") || r === "106/1";
                let its = isSingleTv ? ['ТВ-2000', ...furnitureBase] : ['ТВ-1800', 'ТВ-2300', ...furnitureBase];
                its.forEach(it => { 
                    totalItems++; 
                    let s = localData[r]?.[it] || 0;
                    if(s >= 1 && s <= 3) readyItems++; // Считаем готовыми 1, 2 и 3 выезды
                    else roomReady = false; 
                });
                if(roomReady) readyRooms++;
            });
        }
        document.getElementById('totalProgress').innerText = Math.round((readyItems/totalItems)*100 || 0) + '%';
        document.getElementById('roomsDone').innerText = readyRooms + ' / ' + totalRooms;
    }

    function toggleProblemFilter() { showOnlyProblems = !showOnlyProblems; document.getElementById('probFilter').classList.toggle('active'); renderFloor(activeFloor); }

    const nav = document.getElementById('floorNav');
    for(let i=1; i<=9; i++) {
        const group = document.createElement('div'); group.className = 'floor-btn-group';
        const b = document.createElement('button'); b.className = 'floor-btn' + (i==activeFloor?' active':''); b.innerText = i + ' эт';
        b.onclick = () => { document.querySelectorAll('.floor-btn').forEach(btn => btn.classList.remove('active')); b.classList.add('active'); renderFloor(i); };
        const eye = document.createElement('button'); eye.className = 'toggle-floor' + (disabledFloors.includes(i)?' off':''); eye.innerText = '👁';
        eye.onclick = () => {
            if(!isEditMode) return;
            if(disabledFloors.includes(i)) disabledFloors = disabledFloors.filter(x => x!==i); else disabledFloors.push(i);
            localStorage.setItem('disabled_floors', JSON.stringify(disabledFloors));
            eye.classList.toggle('off'); updateDashboard(); renderFloor(activeFloor);
        };
        group.append(b, eye); nav.appendChild(group);
    }
</script>
</body>
</html>
